name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream Zed ref (tag/SHA) to build instead of UPSTREAM_REF'
        required: false

permissions:
  contents: write      # needed to publish releases / upload assets
  issues: write        # so a failed scheduled build can open an issue

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two x64 runner images verify the build across current toolchains.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: zed-rtl-x86_64.exe
            patcher: zed-rtl-patcher-x86_64.exe
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: zed-rtl-x86_64.exe
            patcher: zed-rtl-patcher-x86_64.exe
          # Windows on ARM. Treated as best-effort: an ARM failure must never
          # block publishing the x64 assets.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: zed-rtl-aarch64.exe
            patcher: zed-rtl-patcher-aarch64.exe
            best_effort: 'true'
          # Linux x64. Also best-effort: a Linux failure must never block the
          # Windows assets, which are what most users install.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: zed-rtl-linux-x86_64.tar.gz
            best_effort: 'true'
          # Linux on ARM, on a native ARM runner (no cross toolchain needed).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zed-rtl-linux-aarch64.tar.gz
            best_effort: 'true'

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout this repo (patch + scripts)
        uses: actions/checkout@v4

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.target }}-${{ matrix.os }}-v3
          restore-keys: cargo-${{ matrix.target }}-${{ matrix.os }}-v3

      - name: Build patched Zed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: ${{ matrix.best_effort == 'true' }}
        run: |
          $buildArgs = @(
            "./scripts/build.patched.ps1",
            "-Target", "${{ matrix.target }}",
            "-ArtifactName", "${{ matrix.artifact }}"
          )
          if ("${{ github.event.inputs.upstream_ref }}") { $buildArgs += "-UpstreamRef", "${{ github.event.inputs.upstream_ref }}" }
          & Powershell -ExecutionPolicy Bypass -File @buildArgs

      - name: Build patched Zed (Linux)
        if: runner.os == 'Linux'
        continue-on-error: ${{ matrix.best_effort == 'true' }}
        run: |
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref }}" \
          TARGET="${{ matrix.target }}" \
          ARTIFACT_NAME="${{ matrix.artifact }}" \
          ./scripts/build.patched.sh

      # Tiny dependency-free crate; builds in seconds for the same target and
      # ends up next to the Zed build in artifacts/. Windows-only: the patcher
      # is a UAC self-elevating .exe, so there is nothing to build on Linux.
      - name: Build the patcher exe
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: ${{ matrix.best_effort == 'true' }}
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --manifest-path patcher/Cargo.toml --target ${{ matrix.target }}
          $src = "patcher/target/${{ matrix.target }}/release/zed-rtl-patcher.exe"
          if (-not (Test-Path $src)) { throw "patcher binary not found: $src" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $out = "artifacts/${{ matrix.patcher }}"
          Copy-Item $src $out -Force
          $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.patcher }}" | Set-Content "artifacts/${{ matrix.patcher }}.sha256" -NoNewline
          Write-Host "Built $out ($([math]::Round((Get-Item $out).Length / 1KB)) KB)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.target }}-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: ${{ matrix.best_effort == 'true' && 'warn' || 'error' }}

  # Single publishing job: pulls every artifact and pushes them all to one
  # release, so the ARM build can't race the x64 one.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only tagged releases are published. A plain push to main just verifies
    # that the patch still builds; it must never create or touch a release.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Assemble release assets
        run: |
          set -e
          mkdir -p release-assets
          # Windows x64: prefer the windows-2022 build, fall back to the 2025 one.
          if ls dl/out-x86_64-pc-windows-msvc-windows-2022/*.exe >/dev/null 2>&1; then
            cp -f dl/out-x86_64-pc-windows-msvc-windows-2022/*.exe release-assets/
            cp -f dl/out-x86_64-pc-windows-msvc-windows-2022/build-info.json release-assets/build-info-x86_64.json
          else
            cp -f dl/out-x86_64-pc-windows-msvc-windows-2025/*.exe release-assets/
            cp -f dl/out-x86_64-pc-windows-msvc-windows-2025/build-info.json release-assets/build-info-x86_64.json
          fi
          cp -f dl/out-aarch64-pc-windows-msvc-windows-11-arm/*.exe release-assets/ 2>/dev/null || true
          # build-info records which upstream Zed version each build is for.
          # The patcher reads it to pick the right release for an install.
          cp -f dl/out-aarch64-pc-windows-msvc-windows-11-arm/build-info.json release-assets/build-info-aarch64.json 2>/dev/null || true
          # Linux: a tarball with bin/zed inside, mirroring upstream's layout.
          # Separate build-info names so the Windows patcher never picks one up.
          for arch in x86_64 aarch64; do
            dir=$(ls -d dl/out-${arch}-unknown-linux-gnu-* 2>/dev/null | head -1 || true)
            if [ -n "$dir" ]; then
              cp -f "$dir"/*.tar.gz release-assets/ 2>/dev/null || true
              cp -f "$dir"/build-info.json "release-assets/build-info-linux-${arch}.json" 2>/dev/null || true
            fi
          done
          # The patch itself, for anyone who builds Zed themselves.
          cp -f patch/zed-rtl.patch release-assets/zed-rtl.patch
          echo '--- assets ---'
          ls -la release-assets
          echo '--- sha256 ---'
          cd release-assets
          for f in *.exe *.tar.gz *.patch; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: Publish to GitHub Releases
        env:
          # Publish as the repo owner, not github-actions[bot], so the
          # Releases page never shows the bot as the release author.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "Publishing to release: $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            notes=$(printf 'Refreshed build of %s @ %s\nAssets: %s' "$tag" "$GITHUB_SHA" "$(ls release-assets | tr '\n' ' ')")
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --verify-tag --generate-notes
          fi
          gh release upload "$tag" release-assets/* --clobber
          echo '--- published ---'
          gh release view "$tag" --json assets --jq '.assets[].name'

  # A scheduled build that fails would otherwise go unnoticed: the tracker
  # keeps pointing at the old version and nobody learns why. Surface it.
  notify-failure:
    needs: build
    runs-on: ubuntu-latest
    if: failure() && github.event_name != 'pull_request'

    steps:
      - name: Open an issue about the failed build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          subject="scheduled build failed"
          if [ "$tag" != "$GITHUB_REF" ]; then subject="build failed for $tag"; fi
          # Keep one open issue per subject so retries do not spam.
          if gh issue list --search "$subject" --state open | grep -q .; then
            echo "An issue is already open: $subject"; exit 0
          fi
          gh issue create \
            --title "$subject" \
            --body "The **Build** workflow failed.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Ref: \`$GITHUB_REF\`

          Check the failed step in the run log. Common causes:
          - The upstream toolchain (\`rust-toolchain.toml\`) changed and a dependency regressed.
          - A runner image lost a build component (Spectre libs, MSVC, Linux dev packages).

          The previous release is untouched and still downloadable."
          echo "Issue opened"
